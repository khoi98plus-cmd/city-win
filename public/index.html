<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Business Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
}

/* HEADER */
.header {
  background: #020617;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #1e293b;
}

/* LOGIN */
.login-box {
  text-align: center;
  margin: 20px;
}

input {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
  width: 200px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 6px;
  background: #38bdf8;
  cursor: pointer;
  font-weight: bold;
}

/* GRID */
.dashboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  padding: 20px;
}

/* CARD */
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.card h3 {
  margin-bottom: 10px;
  color: #94a3b8;
}

.card p {
  font-size: 22px;
  font-weight: bold;
}

/* ALERT */
#alert {
  color: #ef4444;
  text-align: center;
  margin-top: 10px;
}

#advice {
  color: #22c55e;
  text-align: center;
  margin-top: 10px;
}

#scenario {
  color: #facc15;
  text-align: center;
  margin-top: 10px;
}

/* CHART */
.chart-container {
  width: 90%;
  margin: auto;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="header">💼 AI Business Dashboard</div>

<!-- LOGIN -->
<div class="login-box">
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard">
  <div class="card">
    <h3>👥 Traffic</h3>
    <p id="traffic">0</p>
  </div>

  <div class="card">
    <h3>🛒 Orders</h3>
    <p id="orders">0</p>
  </div>

  <div class="card">
    <h3>💰 Revenue</h3>
    <p id="revenue">0</p>
  </div>

  <div class="card">
    <h3>📈 Profit</h3>
    <p id="profit">0</p>
  </div>
</div>

<h2 id="alert"></h2>
<h3 id="advice"></h3>
<h3 id="scenario"></h3>

<div class="chart-container">
  <canvas id="chart"></canvas>
</div>

<script>
let token = "";

const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [
      {
        label: "Revenue",
        data: [],
        borderColor: "#38bdf8",
        tension: 0.3
      },
      {
        label: "Profit",
        data: [],
        borderColor: "#22c55e",
        tension: 0.3
      }
    ]
  },
  options: {
    responsive: true,
    animation: false
  }
});

/* AUTH */
async function register() {
  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  alert(await res.text());
}

async function login() {
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  const data = await res.json();

  if (data.token) {
    token = data.token;
    alert("✅ Login thành công");
  } else {
    alert("❌ Sai thông tin");
  }
}

/* LOAD DATA */
async function loadData() {
  if (!token) return;

  const res = await fetch("/api/business", {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();
  const s = data.state;

  traffic.innerText = s.traffic;
  orders.innerText = s.orders;
  revenue.innerText = s.revenue;
  profit.innerText = s.profit;

  alert.innerText = data.alert;
  advice.innerText = "💡 " + (data.advice.join(" | ") || "Không có");
  scenario.innerText = "🔮 Nếu chạy ads → " + data.scenario.revenue;

  const time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(s.revenue);
  chart.data.datasets[1].data.push(s.profit);

  if (chart.data.labels.length > 10) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }

  chart.update();
}

setInterval(loadData, 2000);
</script>

</body>
</html>
