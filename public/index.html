<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Business Simulator PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #020617;
  height: 100vh;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 20px;
  color: #38bdf8;
}

.sidebar button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #1e293b;
  color: white;
  border: none;
  cursor: pointer;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.status {
  color: #22c55e;
}

/* LOGIN */
.login-box {
  margin-bottom: 20px;
}

input {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 5px;
  background: #38bdf8;
  color: black;
  cursor: pointer;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.card h3 {
  font-size: 14px;
  color: #94a3b8;
}

.card p {
  font-size: 22px;
  margin-top: 5px;
}

/* ALERT */
#alert { color: red; margin-top: 10px; }
#advice { color: #22c55e; margin-top: 10px; }
#scenario { color: #facc15; margin-top: 10px; }

/* CHART */
canvas {
  margin-top: 20px;
  background: #020617;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🚀 AI System</h2>
  <button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
  <h1>📊 Dashboard</h1>
  <div class="status" id="status">Offline</div>
</div>

<!-- LOGIN -->
<div class="login-box">
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- KPI -->
<div class="cards">
  <div class="card">
    <h3>Traffic</h3>
    <p id="traffic">0</p>
  </div>

  <div class="card">
    <h3>Orders</h3>
    <p id="orders">0</p>
  </div>

  <div class="card">
    <h3>Revenue</h3>
    <p id="revenue">0</p>
  </div>

  <div class="card">
    <h3>Profit</h3>
    <p id="profit">0</p>
  </div>
</div>

<h2 id="alert"></h2>
<h3 id="advice"></h3>
<h3 id="scenario"></h3>

<canvas id="chart" height="120"></canvas>

</div>

<script>
let token = "";

/* CHART */
const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [
      { label: "Revenue", data: [], borderColor: "#38bdf8" },
      { label: "Profit", data: [], borderColor: "#22c55e" }
    ]
  },
  options: {
    animation: false,
    plugins: { legend: { labels: { color: "white" } } },
    scales: {
      x: { ticks: { color: "white" } },
      y: { ticks: { color: "white" } }
    }
  }
});

/* AUTH */
async function register() {
  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  alert(await res.text());
}

async function login() {
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  const data = await res.json();

  if (data.token) {
    token = data.token;
    document.getElementById("status").innerText = "Online";
    alert("Login OK");
  }
}

function logout() {
  token = "";
  document.getElementById("status").innerText = "Offline";
}

/* LOAD DATA */
async function loadData() {
  if (!token) return;

  const res = await fetch("/api/business", {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();
  const s = data.state;

  document.getElementById("traffic").innerText = s.traffic;
  document.getElementById("orders").innerText = s.orders;
  document.getElementById("revenue").innerText = s.revenue;
  document.getElementById("profit").innerText = s.profit;

  document.getElementById("alert").innerText = data.alert || "";
  document.getElementById("advice").innerText = "💡 " + (data.advice.join(" | ") || "");
  document.getElementById("scenario").innerText =
    "🔮 Ads → " + data.scenario.revenue;

  const time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(s.revenue);
  chart.data.datasets[1].data.push(s.profit);

  if (chart.data.labels.length > 15) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }

  chart.update();
}

setInterval(loadData, 2000);
</script>

</body>
</html>
