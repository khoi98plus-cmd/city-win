<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Business Simulator PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #020617;
  height: 100vh;
  padding: 20px;
}

.sidebar h2 {
  color: #38bdf8;
  margin-bottom: 20px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  background: #1e293b;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

/* LOGIN */
input {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
  background: #38bdf8;
  cursor: pointer;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.card h3 {
  color: #94a3b8;
  font-size: 14px;
}

.card p {
  font-size: 22px;
}

/* CHAT */
.chat-box {
  background: #020617;
  height: 220px;
  overflow-y: auto;
  padding: 10px;
  border-radius: 10px;
}

.msg-user { color: #38bdf8; }
.msg-ai { color: #22c55e; }
.msg-loading { color: gray; }

canvas {
  margin-top: 20px;
  background: #020617;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🚀 AI System</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">

<div class="header">
  <h1>📊 Dashboard</h1>
  <div id="status">🔴 Offline</div>
</div>

<!-- CHAT -->
<h2>💬 AI Chat</h2>
<div id="chatBox" class="chat-box"></div>

<input id="chatInput" placeholder="Hỏi AI..." style="width:70%;">
<button onclick="sendChat()">Gửi</button>

<!-- LOGIN -->
<div>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- KPI -->
<div class="cards">
  <div class="card"><h3>Traffic</h3><p id="traffic">0</p></div>
  <div class="card"><h3>Orders</h3><p id="orders">0</p></div>
  <div class="card"><h3>Revenue</h3><p id="revenue">0</p></div>
  <div class="card"><h3>Profit</h3><p id="profit">0</p></div>
</div>

<h3 id="alert"></h3>
<h3 id="advice"></h3>
<h3 id="scenario"></h3>

<canvas id="chart"></canvas>

</div>

<script>
let token = localStorage.getItem("token") || "";

/* STATUS */
if (token) {
  document.getElementById("status").innerText = "🟢 Online";
}

/* ENTER CHAT */
document.getElementById("chatInput").addEventListener("keypress", e => {
  if (e.key === "Enter") sendChat();
});

/* CHART */
const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: [],
    datasets: [
      { label: "Revenue", data: [], borderColor: "#38bdf8" },
      { label: "Profit", data: [], borderColor: "#22c55e" }
    ]
  },
  options: { animation: false }
});

/* AUTH */
async function register() {
  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ username: user.value, password: pass.value })
  });
  alert(await res.text());
}

async function login() {
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: user.value,
        password: pass.value
      })
    });

    const data = await res.json();

    if (data.token) {
      token = data.token;
      localStorage.setItem("token", token);
      document.getElementById("status").innerText = "🟢 Online";
      alert("Login thành công");
    } else {
      alert(data.error || "Sai tài khoản hoặc mật khẩu");
    }

  } catch (err) {
    alert("Lỗi server login");
  }
}

function logout() {
  token = "";
  localStorage.removeItem("token");
  status.innerText = "🔴 Offline";
}

/* CHAT */
async function sendChat() {
  if (!token) return alert("Bạn chưa login");

  const input = document.getElementById("chatInput");
  const box = document.getElementById("chatBox");

  if (!input.value) return;

  box.innerHTML += `<div class="msg-user">🧑 ${input.value}</div>`;

  const loading = document.createElement("div");
  loading.className = "msg-loading";
  loading.innerText = "🤖 Đang suy nghĩ...";
  box.appendChild(loading);

  const message = input.value;
  input.value = "";

  try {
    const res = await fetch("/api/ai", {
      method: "POST",
      headers: {
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    loading.remove();
    box.innerHTML += `<div class="msg-ai">🤖 ${data.reply}</div>`;
    box.scrollTop = box.scrollHeight;

  } catch {
    loading.innerText = "❌ Lỗi AI";
  }
}

/* DATA */
async function loadData() {
  if (!token) return;

  const res = await fetch("/api/business", {
    headers: { Authorization: "Bearer " + token }
  });

  const data = await res.json();
  const s = data.state;

  traffic.innerText = s.traffic;
  orders.innerText = s.orders;
  revenue.innerText = s.revenue;
  profit.innerText = s.profit;

  alert.innerText = data.alert || "";
  advice.innerText = "💡 " + (data.advice?.join(" | ") || "");
  scenario.innerText = "🔮 Ads → " + (data.scenario?.revenue || 0);

  const t = new Date().toLocaleTimeString();

  chart.data.labels.push(t);
  chart.data.datasets[0].data.push(s.revenue);
  chart.data.datasets[1].data.push(s.profit);

  if (chart.data.labels.length > 15) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }

  chart.update();
}

setInterval(loadData, 2000);
</script>

</body>
</html>
