<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Login AI System</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#020617,#0f172a);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.box {
  background: #020617;
  padding: 30px;
  border-radius: 15px;
  width: 300px;
  box-shadow: 0 0 20px rgba(56,189,248,0.3);
}

h2 {
  text-align: center;
  color: #38bdf8;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #38bdf8;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}
</style>
</head>

<body>

<div class="box">
  <h2>🚀 AI SYSTEM</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
</div>

<script>
async function login() {
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    window.location.href = "home.html";
  } else {
    alert("Sai tài khoản hoặc mật khẩu");
  }
}

async function register() {
  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  alert(await res.text());
}
</script>

</body>
</html>
